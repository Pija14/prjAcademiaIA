name: Deploy Meu Treino to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static frontend
        env:
          AI_API_URL: ${{ vars.AI_API_URL }}
        run: |
          mkdir public
          cp index.html app.js styles.css manifest.json icon.svg sw.js public/
          cp -R icons public/icons
          printf 'window.MEU_TREINO_CONFIG = { AI_API_URL: "%s" };\n' "$AI_API_URL" > public/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4

