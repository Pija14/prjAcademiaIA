name: Deploy Meu Treino to GitHub Pages

# Trigger GitHub Pages deployment
on:
  push:
    branches: [refactor/arquitetura-modular, tela-inicial-google-design-system]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-refactor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static frontend
        env:
          AI_API_URL: ${{ vars.AI_API_URL || 'https://prjacademiaia.onrender.com' }}
        run: |
          set -e
          mkdir -p public
          cp index.html app.js styles.css manifest.json icon.svg sw.js public/
          cp -R icons public/icons
          mkdir -p public/src
          cp -R src/. public/src/
          printf 'window.MEU_TREINO_CONFIG = { AI_API_URL: "%s" };\n' "$AI_API_URL" > public/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
