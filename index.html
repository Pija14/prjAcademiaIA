<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A192B">
  <meta name="description" content="GymIA — inteligência para o seu treino">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/logo-gymia.svg">
  <title>GymIA</title>
  <link rel="stylesheet" href="styles.css?v=60">
  <link rel="stylesheet" href="home-layout.css?v=60">
  <link rel="stylesheet" href="login.css?v=61">
</head>
<body>
  <div id="app"></div>
  <script src="config.js"></script>
  <script src="app.js?v=60"></script>
  <script>
    window._gymiaAuthMode='login';
    window.toggleAuthMode=function(mode){window._gymiaAuthMode=mode==='register'?'register':'login';window.renderAuthScreen();};
    window.renderAuthScreen=function(){
      const app=document.getElementById('app');if(!app)return;
      const isLogin=window._gymiaAuthMode!=='register';
      const icon=(type)=>{
        if(type==='mail')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';
        if(type==='lock')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
        if(type==='eye')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>';
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 3.4-6 8-6s7.2 2 8 6"/></svg>';
      };
      app.innerHTML=`<section id="gymia-login" class="gymia-login" aria-label="Login GymIA"><div class="gymia-login__screen"><div class="gymia-login__brand"><img class="gymia-login__logo" src="assets/logo-gymia.svg" alt="GymIA"></div><form class="gymia-login__form" novalidate onsubmit="return ${isLogin?'handleLoginSubmit(event)':'handleRegisterSubmit(event)'}">${isLogin?`<label class="gymia-login__field"><span class="gymia-login__field-icon">${icon('mail')}</span><span class="gymia-login__field-content"><span class="gymia-login__label">E-mail</span><input id="auth-email" type="email" autocomplete="email" placeholder="Digite seu e-mail" aria-label="E-mail" required></span></label><label class="gymia-login__field"><span class="gymia-login__field-icon">${icon('lock')}</span><span class="gymia-login__field-content"><span class="gymia-login__label">Senha</span><input id="auth-password" type="password" autocomplete="current-password" placeholder="Digite sua senha" aria-label="Senha" required></span><button type="button" class="gymia-login__eye" onclick="togglePassword('auth-password',this)" aria-label="Mostrar senha">${icon('eye')}</button></label><div class="gymia-login__error" id="gymia-login-error"></div><button class="gymia-login__primary" type="submit"><span>Entrar</span></button><button class="gymia-login__link gymia-login__forgot" type="button" onclick="alert('A recuperação de senha será disponibilizada em uma próxima etapa.')">Esqueci minha senha</button><div class="gymia-login__divider"><span>ou</span></div><button class="gymia-login__secondary" type="button" onclick="toggleAuthMode('register')">${icon('user')}<span>Criar conta</span></button>`:`<div class="gymia-login__register-title">Criar uma conta</div><label class="gymia-login__field">${icon('user')}<input id="register-name" type="text" autocomplete="name" placeholder="Nome" required></label><label class="gymia-login__field">${icon('mail')}<input id="register-email" type="email" autocomplete="email" placeholder="E-mail" required></label><label class="gymia-login__field">${icon('lock')}<input id="register-password" type="password" autocomplete="new-password" placeholder="Senha" minlength="6" required><button type="button" class="gymia-login__eye" onclick="togglePassword('register-password',this)" aria-label="Mostrar senha">${icon('eye')}</button></label><label class="gymia-login__field">${icon('lock')}<input id="register-password-confirm" type="password" autocomplete="new-password" placeholder="Confirmar senha" minlength="6" required><button type="button" class="gymia-login__eye" onclick="togglePassword('register-password-confirm',this)" aria-label="Mostrar senha">${icon('eye')}</button></label><button class="gymia-login__primary" type="submit"><span>Criar conta</span></button><button class="gymia-login__back" type="button" onclick="toggleAuthMode('login')">Voltar para Entrar</button>`}</form></div></section>`;
    };
    if(typeof getAccessToken==='function'?!getAccessToken():true)window.renderAuthScreen();
  </script>
</body>
</html>
