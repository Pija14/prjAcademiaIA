<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Aplicativo pessoal de gerenciamento de treinos">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg">
  <title>GymIA</title>
  <link rel="stylesheet" href="styles.css?v=52">
  <link rel="stylesheet" href="home-layout.css?v=52">
  <style>
    /* GymIA — login visual aprovado. Somente apresentação; autenticação permanece no app.js. */
    .gymia-auth{min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:28px 18px 30px;background:#fff;overflow:auto}
    .gymia-auth__brand{width:min(100%,390px);text-align:center;margin:4px auto 24px}
    .gymia-auth__logo{width:min(78vw,330px);height:250px;margin:0 auto 4px;background:url('./assets/gymia-logo.svg') center/contain no-repeat}
    .gymia-auth__card{width:min(100%,390px);box-sizing:border-box;padding:28px 22px 24px;border:0;border-radius:30px;background:#fff;box-shadow:0 12px 34px rgba(10,25,43,.10)}
    .gymia-auth__title{display:none}
    .gymia-auth__toggle{display:none}
    .gymia-auth__field{display:block;margin:0 0 16px;color:#738399;font-size:0;font-weight:700}
    .gymia-auth__field>span{display:none}
    .gymia-auth__field input{width:100%;min-height:58px;box-sizing:border-box;padding:0 18px 0 62px;border:1px solid #dce7f4;border-radius:18px;background:#f4f8fd;color:#0a192b;font-size:16px;outline:none;box-shadow:inset 0 1px 2px rgba(10,25,43,.02)}
    .gymia-auth__field input::placeholder{color:#8291a5;opacity:1}
    .gymia-auth__field input:focus{border-color:#1473e6;box-shadow:0 0 0 4px rgba(20,115,230,.10)}
    .gymia-auth__field{position:relative}
    .gymia-auth__field:has(#auth-email)::before{content:'✉';position:absolute;left:20px;top:50%;transform:translateY(-50%);z-index:2;color:#4d6480;font-size:24px}
    .gymia-auth__field:has(#auth-password)::before{content:'♙';position:absolute;left:21px;top:50%;transform:translateY(-50%);z-index:2;color:#4d6480;font-size:25px}
    .gymia-auth__password{position:relative}
    .gymia-auth__password input{padding-right:56px}
    .gymia-auth__eye{position:absolute;right:7px;top:50%;width:44px;height:44px;min-width:44px;min-height:44px;transform:translateY(-50%);border-radius:12px;background:transparent;color:#4d6480;font-size:18px}
    .gymia-auth__submit{width:100%;min-height:58px;margin-top:5px;border:0;border-radius:18px;background:#1473e6!important;color:#fff!important;font-size:20px;font-weight:800;box-shadow:0 10px 22px rgba(20,115,230,.20)}
    .gymia-auth__submit::after{content:'  →';font-size:24px}
    .gymia-auth__link{display:block;margin:15px auto 0;padding:5px 8px;border:0;background:transparent;color:#1473e6;font-size:14px;font-weight:700}
    .gymia-auth__link:active{transform:none}
    .gymia-auth__card form::after{content:'ou';display:block;margin:25px auto 18px;text-align:center;color:#8190a3;font-size:16px;font-weight:700}
    .gymia-auth__card form:has(#auth-email)::before{content:'Criar conta';display:block;position:absolute;margin-top:300px;left:22px;right:22px;height:54px;line-height:54px;border:2px solid #1473e6;border-radius:18px;color:#1473e6;text-align:center;font-size:17px;font-weight:800;pointer-events:none}
    @media(max-width:390px){.gymia-auth{padding-left:14px;padding-right:14px}.gymia-auth__logo{height:220px}.gymia-auth__card{padding-left:18px;padding-right:18px}.gymia-auth__card form:has(#auth-email)::before{left:18px;right:18px}}
    @media(max-height:760px){.gymia-auth{padding-top:12px}.gymia-auth__brand{margin-bottom:8px}.gymia-auth__logo{height:190px}.gymia-auth__card{padding-top:18px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="config.js"></script>
  <script src="app.js?v=51"></script>
  <script>
    /* Apenas a apresentação da autenticação. Os handlers existentes continuam sendo usados. */
    window._gymiaAuthMode='login';
    window.toggleAuthMode=function(mode){window._gymiaAuthMode=mode==='register'?'register':'login';window.renderAuthScreen();};
    window.renderAuthScreen=function(){
      const app=document.getElementById('app');
      if(!app)return;
      const isLogin=window._gymiaAuthMode!=='register';
      app.innerHTML=`
        <div class="gymia-auth">
          <div class="gymia-auth__brand"><div class="gymia-auth__logo" aria-label="GymIA"></div></div>
          <div class="gymia-auth__card">
            ${isLogin?`
              <form onsubmit="return handleLoginSubmit(event)">
                <label class="gymia-auth__field"><span>E-mail</span><input id="auth-email" type="email" placeholder="E-mail" autocomplete="email" required></label>
                <label class="gymia-auth__field"><span>Senha</span><div class="gymia-auth__password"><input id="auth-password" type="password" placeholder="Senha" autocomplete="current-password" required><button type="button" class="gymia-auth__eye" onclick="togglePassword('auth-password',this)" aria-label="Mostrar senha">◉</button></div></label>
                <button class="gymia-auth__submit" type="submit">Entrar</button>
                <button class="gymia-auth__link" type="button" onclick="alert('A recuperação de senha será disponibilizada em uma próxima etapa.')">Esqueci minha senha</button>
              </form>
              <button type="button" class="gymia-auth__link" style="border:2px solid #1473e6;border-radius:18px;width:100%;min-height:54px;margin-top:18px;font-size:17px" onclick="toggleAuthMode('register')">Criar conta</button>
            `:`
              <form onsubmit="return handleRegisterSubmit(event)">
                <label class="gymia-auth__field"><span>Nome</span><input id="register-name" type="text" placeholder="Nome" autocomplete="name" required></label>
                <label class="gymia-auth__field"><span>E-mail</span><input id="register-email" type="email" placeholder="E-mail" autocomplete="email" required></label>
                <label class="gymia-auth__field"><span>Senha</span><div class="gymia-auth__password"><input id="register-password" type="password" placeholder="Senha" autocomplete="new-password" minlength="6" required><button type="button" class="gymia-auth__eye" onclick="togglePassword('register-password',this)" aria-label="Mostrar senha">◉</button></div></label>
                <label class="gymia-auth__field"><span>Confirmar senha</span><div class="gymia-auth__password"><input id="register-password-confirm" type="password" placeholder="Confirmar senha" autocomplete="new-password" minlength="6" required><button type="button" class="gymia-auth__eye" onclick="togglePassword('register-password-confirm',this)" aria-label="Mostrar senha">◉</button></div></label>
                <button class="gymia-auth__submit" type="submit">Criar conta</button>
              </form>
              <button type="button" class="gymia-auth__link" onclick="toggleAuthMode('login')">Voltar para Entrar</button>
            `}
          </div>
        </div>`;
    };
  </script>
</body>
</html>
