services:
  - type: web
    name: prjacademiaia
    runtime: python
    region: oregon
    plan: free
    rootDir: ai-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://pija14.github.io,https://localhost:8000,http://localhost:8000,https://127.0.0.1:8000,http://127.0.0.1:8000"
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
